<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Giriş - Flame SMP</title>
<link rel="stylesheet" href="style.css">
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
</head>
<body>

<header>
  <div class="nav">
    <a class="logo" href="index.html"><img src="images/teklifsimge1.png" alt="">FLAME SMP</a>
    <div class="links">
      <a href="index.html">Ana Sayfa</a>
      <a href="minigame.html">Minigame</a>
      <a href="market.html">Market</a>
    </div>
    <span></span>
  </div>
</header>

<section class="container">
  <div class="card login-box">
    <h1 class="title">Giriş Yap</h1>
    <p class="sub">Puanlarını takip etmek için giriş yap.</p>
    <button class="btn" id="googleBtn">Google ile Giriş Yap</button>
    <p class="msg" id="msg"></p>
  </div>
</section>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyCpzhxGAr0FErpDZpv6wDi-3x0kGb8cd6M",
  authDomain: "flamesmp-2e0a9.firebaseapp.com",
  projectId: "flamesmp-2e0a9",
  storageBucket: "flamesmp-2e0a9.firebasestorage.app",
  messagingSenderId: "342260381938",
  appId: "1:342260381938:web:23f3e50f30701b4355786b",
  measurementId: "G-SP88WQ8M10"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

// Giriş yapan kullanıcı için users/{uid} kaydı yoksa oluştur
async function ensureUserDoc(user) {
  const ref = db.collection('users').doc(user.uid);
  const snap = await ref.get();
  if (!snap.exists) {
    await ref.set({
      mcName: '',               // Minecraft adı, sonra eklenecek
      displayName: user.displayName || '',
      points: 0,
      dailyDay: 0,
      dailyCount: 0
    });
  }
}

document.getElementById('googleBtn').onclick = async () => {
  const msg = document.getElementById('msg');
  try {
    const result = await auth.signInWithPopup(new firebase.auth.GoogleAuthProvider());
    await ensureUserDoc(result.user);
    msg.textContent = `Hoş geldin, ${result.user.displayName}!`;
  } catch (e) {
    msg.textContent = 'Giriş başarısız: ' + e.message;
  }
};

// Sayfa açılınca zaten giriş yapılmışsa durumu göster
auth.onAuthStateChanged(async user => {
  if (user) {
    await ensureUserDoc(user);
    document.getElementById('msg').textContent = `Giriş yapıldı: ${user.displayName}`;
  }
});
</script>

</body>
</html>
