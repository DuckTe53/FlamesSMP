<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Minigame - Flame SMP</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <div class="nav">
    <a class="logo" href="index.html"><img src="images/teklifsimge1.png" alt="">FLAME SMP</a>
    <div class="links">
      <a href="index.html">Ana Sayfa</a>
      <a class="active" href="minigame.html">Minigame</a>
      <a href="market.html">Market</a>
    </div>
    <a class="btn" href="login.html">Giriş Yap</a>
  </div>
</header>

<section class="container">
  <h1 class="title">Minigame</h1>
  <p class="sub">Her turda 10 ateş topu gelir. Her isabet 10 puan! Günde 5 hakkın var.</p>

  <div class="card">
    <div class="stats">
      Kalan Hak: <span id="plays">5/5</span> &nbsp;|&nbsp; İsabet: <span id="hits">0</span>/10 &nbsp;|&nbsp; Kazanılan Puan: <span id="points">0</span>
    </div>
    <div class="game-box" id="box">
      <button class="btn" id="startBtn" style="position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)">Başla</button>
    </div>
    <p class="msg" id="msg"></p>
  </div>
</section>

<script>
const DAILY_LIMIT = 5;      // Günlük hak
const FIREBALLS = 10;       // Tur başına ateş topu
const POINTS_PER_HIT = 10;  // Her isabet puanı
const FB_LIFE = 1200;       // Bir ateş topunun ekranda kalma süresi (ms)
const SPAWN_GAP = 900;      // Ateş topları arası süre (ms)

const box = document.getElementById('box');
const startBtn = document.getElementById('startBtn');
const playsEl = document.getElementById('plays');
const hitsEl = document.getElementById('hits');
const pointsEl = document.getElementById('points');
const msg = document.getElementById('msg');

let running = false, spawned = 0, resolved = 0, hits = 0;

// Günlük hak takibi (şimdilik tarayıcıda; Firebase bağlanınca sunucuya taşınacak)
const todayKey = () => new Date().toLocaleDateString('en-CA'); // YYYY-MM-DD, yerel saat
function getPlays() {
  const d = JSON.parse(localStorage.getItem('flame_minigame') || 'null');
  return (!d || d.date !== todayKey()) ? 0 : d.count;
}
function addPlay() {
  localStorage.setItem('flame_minigame', JSON.stringify({ date: todayKey(), count: getPlays() + 1 }));
}
function refreshPlays() {
  const left = DAILY_LIMIT - getPlays();
  playsEl.textContent = `${left}/${DAILY_LIMIT}`;
  return left;
}

function start() {
  if (running) return;
  if (getPlays() >= DAILY_LIMIT) {
    msg.textContent = 'Bugünlük 5 hakkın bitti, yarın tekrar gel!';
    return;
  }
  addPlay();
  refreshPlays();

  running = true;
  spawned = 0; resolved = 0; hits = 0;
  hitsEl.textContent = 0; pointsEl.textContent = 0;
  msg.textContent = '';
  startBtn.style.display = 'none';
  box.querySelectorAll('.target').forEach(t => t.remove());

  spawnLoop();
}

function spawnLoop() {
  if (spawned >= FIREBALLS) return;
  spawned++;
  spawnFireball();
  setTimeout(spawnLoop, SPAWN_GAP);
}

function spawnFireball() {
  const t = document.createElement('button');
  t.className = 'target';
  const img = document.createElement('img');
  img.src = 'images/fireball.png';
  img.alt = '';
  t.appendChild(img);

  t.style.left = Math.random() * (box.clientWidth - 70) + 'px';
  t.style.top = Math.random() * (box.clientHeight - 70) + 'px';

  let done = false;
  const resolve = (hit) => {
    if (done) return;
    done = true;
    if (hit) {
      hits++;
      hitsEl.textContent = hits;
      pointsEl.textContent = hits * POINTS_PER_HIT;
    }
    t.remove();
    resolved++;
    if (resolved === FIREBALLS) finish();
  };

  t.onclick = () => resolve(true);
  box.appendChild(t);
  setTimeout(() => resolve(false), FB_LIFE);
}

function addDemoPoints(amount) {
  // TODO: Firebase Cloud Function ile puanı sunucuda doğrula ve kaydet
  const current = Number(localStorage.getItem('flame_points') || 0);
  localStorage.setItem('flame_points', current + amount);
}

function finish() {
  running = false;
  const earned = hits * POINTS_PER_HIT;
  addDemoPoints(earned);

  const left = refreshPlays();
  msg.textContent = `Tur bitti! ${hits} isabet, ${earned} puan kazandın.`;
  startBtn.style.display = 'inline-block';
  startBtn.disabled = left <= 0;
  startBtn.textContent = left > 0 ? 'Tekrar Oyna' : 'Hak Bitti';
}

startBtn.onclick = start;
refreshPlays();
</script>

</body>
</html>
