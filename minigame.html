<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Minigame - Flame SMP</title>
<link rel="icon" type="image/png" href="images/favicon.png">
<link rel="stylesheet" href="style.css">
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
</head>
<body>

<header>
  <div class="nav">
    <a class="logo" href="index.html"><img src="images/teklifsimge1.png" alt="">FLAME SMP</a>
    <div class="links">
      <a href="index.html">Ana Sayfa</a>
      <a class="active" href="minigame.html">Minigame</a>
      <a href="market.html">Market</a>
    </div>
    <a class="btn" href="login.html">Giriş Yap</a>
  </div>
</header>

<section class="container">
  <h1 class="title">Minigame</h1>
  <p class="sub">Her turda 10 ateş topu gelir. Her isabet 10 puan! Günde 5 hakkın var.</p>

  <div class="card">
    <div class="stats">
      Kalan Hak: <span id="plays">-/5</span> &nbsp;|&nbsp; İsabet: <span id="hits">0</span>/10 &nbsp;|&nbsp; Kazanılan Puan: <span id="points">0</span>
    </div>
    <div class="game-box" id="box">
      <button class="btn" id="startBtn" disabled style="position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)">Başla</button>
    </div>
    <p class="msg" id="msg">Oynamak için giriş yapmalısın.</p>
  </div>
</section>

<script src="firebase-config.js"></script>
<script>
const DAILY_LIMIT = 5;
const FIREBALLS = 10;
const POINTS_PER_HIT = 10;
const FB_LIFE = 1200;
const SPAWN_GAP = 900;

const box = document.getElementById('box');
const startBtn = document.getElementById('startBtn');
const playsEl = document.getElementById('plays');
const hitsEl = document.getElementById('hits');
const pointsEl = document.getElementById('points');
const msg = document.getElementById('msg');

let uid = null;
let dailyDay = 0, dailyCount = 0;   // Firestore'dan gelen son durum
let running = false, spawned = 0, resolved = 0, hits = 0;

function playsLeft() {
  const used = dailyDay === todayKey() ? dailyCount : 0;
  return DAILY_LIMIT - used;
}

function refreshPlays() {
  playsEl.textContent = `${playsLeft()}/${DAILY_LIMIT}`;
  startBtn.disabled = !uid || running || playsLeft() <= 0;
  if (uid && playsLeft() <= 0 && !running) {
    startBtn.textContent = 'Hak Bitti';
    msg.textContent = 'Bugünlük 5 hakkın bitti, yarın tekrar gel!';
  } else if (uid && !running) {
    startBtn.textContent = 'Başla';
  }
}

auth.onAuthStateChanged(async user => {
  if (!user) {
    uid = null;
    msg.textContent = 'Oynamak için giriş yapmalısın.';
    refreshPlays();
    return;
  }
  uid = user.uid;
  const snap = await db.collection('users').doc(uid).get();
  const d = snap.data() || {};
  dailyDay = d.dailyDay || 0;
  dailyCount = d.dailyCount || 0;
  msg.textContent = '';
  refreshPlays();
});

function startGame() {
  if (!uid || running || playsLeft() <= 0) return;
  running = true;
  spawned = 0; resolved = 0; hits = 0;
  hitsEl.textContent = 0; pointsEl.textContent = 0;
  msg.textContent = '';
  startBtn.style.display = 'none';
  box.querySelectorAll('.target').forEach(t => t.remove());
  spawnLoop();
}

function spawnLoop() {
  if (spawned >= FIREBALLS) return;
  spawned++;
  spawnFireball();
  setTimeout(spawnLoop, SPAWN_GAP);
}

function spawnFireball() {
  const t = document.createElement('button');
  t.className = 'target';
  const img = document.createElement('img');
  img.src = 'images/fireball.png';
  img.alt = '';
  t.appendChild(img);

  t.style.left = Math.random() * (box.clientWidth - 70) + 'px';
  t.style.top = Math.random() * (box.clientHeight - 70) + 'px';

  let done = false;
  const resolve = (hit) => {
    if (done) return;
    done = true;
    if (hit) {
      hits++;
      hitsEl.textContent = hits;
      pointsEl.textContent = hits * POINTS_PER_HIT;
    }
    t.remove();
    resolved++;
    if (resolved === FIREBALLS) finish();
  };

  t.onclick = () => resolve(true);
  box.appendChild(t);
  setTimeout(() => resolve(false), FB_LIFE);
}

async function finish() {
  running = false;
  const earned = hits * POINTS_PER_HIT;
  const t = todayKey();
  const newCount = dailyDay === t ? dailyCount + 1 : 1;

  try {
    await db.collection('users').doc(uid).update({
      points: firebase.firestore.FieldValue.increment(earned),
      dailyDay: t,
      dailyCount: newCount
    });
    dailyDay = t;
    dailyCount = newCount;
    msg.textContent = `Tur bitti! ${hits} isabet, ${earned} puan kazandın.`;
  } catch (e) {
    msg.textContent = 'Puan kaydedilemedi: ' + e.message;
  }

  startBtn.style.display = 'inline-block';
  refreshPlays();
  if (playsLeft() > 0) startBtn.textContent = 'Tekrar Oyna';
}

startBtn.onclick = startGame;
</script>

</body>
</html>
