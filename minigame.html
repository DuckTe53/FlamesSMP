<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Minigame - Flame SMP</title>
<link rel="icon" type="image/png" href="logoflame.png">
<link rel="stylesheet" href="style.css">
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<style>
  .scene{position:relative;border:3px solid var(--s);border-radius:16px;overflow:hidden;
    background:linear-gradient(180deg,#bfe9ff 0%,#e9f8ff 38%,#8fd66b 38%,#6cb850 52%,#8b5a2b 52%,#6b4220 100%);
    padding:24px 16px 20px}
  .board{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;max-width:480px;margin:0 auto}
  .block{aspect-ratio:1;border-radius:6px;border:2px solid #4a4a4a;cursor:pointer;
    display:flex;align-items:center;justify-content:center;font-size:1.4rem;user-select:none;
    background:repeating-linear-gradient(45deg,#8e8e8e 0 6px,#7a7a7a 6px 12px);
    box-shadow:inset 0 -3px 0 rgba(0,0,0,.25);transition:transform .1s}
  .block:hover:not(.open){transform:scale(1.05);filter:brightness(1.1)}
  .block.dug{cursor:default;background:#5a3d28;box-shadow:inset 0 3px 6px rgba(0,0,0,.4)}
  .block.diamond{cursor:default;background:#bff4ff;border-color:#2aa7c9;animation:pop .3s}
  .block.reveal{cursor:default;opacity:.55;border-style:dashed;border-color:#2aa7c9;background:#d8f7ff}
  .block.open{cursor:default}
  @keyframes pop{from{transform:scale(.4)}to{transform:scale(1)}}
  .bar{display:flex;gap:18px;justify-content:center;flex-wrap:wrap;margin:16px 0;font-weight:700;font-size:1.05rem}
  .bar span.v{color:var(--p)}
</style>
</head>
<body>

<header>
  <div class="nav">
    <div style="display:flex;align-items:center;gap:12px">
      <a class="logo" href="index.html"><img src="logoflame.png" alt="">FLAME SMP</a>
      <span class="who" id="who"><span class="dot"></span><span id="whoName"></span></span>
    </div>
    <div class="links">
      <a href="index.html">Ana Sayfa</a>
      <a class="active" href="minigame.html">Minigame</a>
      <a href="market.html">Market</a>
    </div>
    <a class="btn" href="login.html">Giriş Yap</a>
  </div>
</header>

<section class="container">
  <h1 class="title">Minigame</h1>
  <p class="sub">Günde 3 hak. Her turda 5 kazma hakkın var. 30 bloğun içinde 3 elmas gizli, her elmas 25 puan!</p>

  <div class="card">
    <div class="bar">
      <span>Kalan Hak: <span class="v" id="plays">-/3</span></span>
      <span>Kazma: <span class="v" id="digs">5/5</span></span>
      <span>Elmas: <span class="v" id="found">0/3</span></span>
      <span>Kazanılan Puan: <span class="v" id="points">0</span></span>
    </div>

    <div class="scene">
      <div class="board" id="board"></div>
    </div>

    <div style="text-align:center;margin-top:16px">
      <button class="btn" id="startBtn" disabled>Başla</button>
    </div>
    <p class="msg" id="msg">Oynamak için giriş yapmalısın.</p>
  </div>
</section>

<script src="firebase-config.js"></script>
<script>
const DAILY_LIMIT = 3;
const DIG_LIMIT = 5;
const COLS = 6, ROWS = 5;
const BLOCKS = COLS * ROWS;      // 30
const DIAMONDS = 3;
const POINTS_PER_DIAMOND = 25;

const $ = id => document.getElementById(id);
const boardEl = $('board'), startBtn = $('startBtn'), msg = $('msg');
const playsEl = $('plays'), digsEl = $('digs'), foundEl = $('found'), pointsEl = $('points');

let uid = null;
let dailyDay = 0, dailyCount = 0;
let running = false, digs = 0, found = 0;
let diamonds = new Set();

for (let i = 0; i < BLOCKS; i++) {
  const b = document.createElement('div');
  b.className = 'block';
  b.dataset.i = i;
  boardEl.appendChild(b);
}

function playsLeft() {
  const used = dailyDay === todayKey() ? dailyCount : 0;
  return DAILY_LIMIT - used;
}

function update() {
  playsEl.textContent = `${playsLeft()}/${DAILY_LIMIT}`;
  digsEl.textContent = `${DIG_LIMIT - digs}/${DIG_LIMIT}`;
  foundEl.textContent = `${found}/${DIAMONDS}`;
  pointsEl.textContent = found * POINTS_PER_DIAMOND;
  refreshButton();
}

function refreshButton() {
  if (running) { startBtn.style.display = 'none'; return; }
  startBtn.style.display = 'inline-block';
  if (!uid) { startBtn.disabled = true; startBtn.textContent = 'Başla'; return; }
  if (playsLeft() <= 0) {
    startBtn.disabled = true;
    startBtn.textContent = 'Hak Bitti';
    msg.textContent = 'Bugünlük 3 hakkın bitti, yarın tekrar gel!';
  } else {
    startBtn.disabled = false;
    startBtn.textContent = dailyCount === 0 ? 'Başla' : 'Tekrar Oyna';
  }
}

function resetBoard() {
  boardEl.querySelectorAll('.block').forEach(b => {
    b.className = 'block';
    b.textContent = '';
  });
}

function pickDiamonds() {
  const idx = [...Array(BLOCKS).keys()];
  for (let i = idx.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [idx[i], idx[j]] = [idx[j], idx[i]];
  }
  return new Set(idx.slice(0, DIAMONDS));
}

function startGame() {
  if (!uid || running || playsLeft() <= 0) return;
  running = true;
  digs = 0; found = 0;
  diamonds = pickDiamonds();
  resetBoard();
  msg.textContent = 'Kazmaya başla! 5 kazma hakkın var.';
  update();
}

boardEl.addEventListener('click', e => {
  const b = e.target.closest('.block');
  if (!b || !running || b.classList.contains('open')) return;

  const i = Number(b.dataset.i);
  b.classList.add('open');
  digs++;

  if (diamonds.has(i)) {
    found++;
    b.classList.add('diamond');
    b.textContent = '💎';
  } else {
    b.classList.add('dug');
  }

  update();
  if (found === DIAMONDS || digs === DIG_LIMIT) finish();
});

async function finish() {
  running = false;
  const earned = found * POINTS_PER_DIAMOND;

  diamonds.forEach(i => {
    const b = boardEl.children[i];
    if (!b.classList.contains('open')) {
      b.classList.add('reveal', 'open');
      b.textContent = '💎';
    }
  });

  const t = todayKey();
  const newCount = dailyDay === t ? dailyCount + 1 : 1;

  try {
    await db.collection('users').doc(uid).update({
      points: firebase.firestore.FieldValue.increment(earned),
      dailyDay: t,
      dailyCount: newCount
    });
    dailyDay = t;
    dailyCount = newCount;
    msg.textContent = `Tur bitti! ${found} elmas buldun, ${earned} puan kazandın.`;
  } catch (e) {
    msg.textContent = 'Puan kaydedilemedi: ' + e.message;
  }
  update();
}

startBtn.onclick = startGame;

auth.onAuthStateChanged(async user => {
  if (!user) {
    uid = null;
    $('who').classList.remove('on');
    msg.textContent = 'Oynamak için giriş yapmalısın.';
    update();
    return;
  }
  uid = user.uid;
  $('who').classList.add('on');
  $('whoName').textContent = user.displayName || 'Oyuncu';

  const snap = await db.collection('users').doc(uid).get();
  const d = snap.data() || {};
  dailyDay = d.dailyDay || 0;
  dailyCount = d.dailyCount || 0;
  msg.textContent = '';
  update();
});

update();
</script>

</body>
</html>
