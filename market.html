<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Market - Flame SMP</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <div class="nav">
    <a class="logo" href="index.html"><img src="images/teklifsimge1.png" alt="">FLAME SMP</a>
    <div class="links">
      <a href="index.html">Ana Sayfa</a>
      <a href="minigame.html">Minigame</a>
      <a class="active" href="market.html">Market</a>
    </div>
    <span class="pts">Puan: <strong id="pts">0</strong></span>
  </div>
</header>

<section class="container">

  <!-- ALINANLAR (en üst) -->
  <h2>Alınanlar</h2>
  <div class="card" style="margin-bottom:40px">
    <div class="owned-list" id="owned">
      <p class="empty">Henüz bir satın alımın yok.</p>
    </div>
  </div>

  <!-- MARKET -->
  <h2>Market</h2>
  <p class="sub">Teklifin üstüne gelince içeriğini görebilirsin.</p>
  <div class="grid" id="products"></div>
</section>

<script>
const PRODUCTS = [
  { id: 'extra-kalp',  name: 'Extra Kalp',  price: 150,  icon: 'images/teklifsimge1.png', img: 'images/icerik1.png' },
  { id: 'revive',      name: 'Revive',      price: 500,  icon: 'images/teklifsimge2.png', img: 'images/icerik1.png' },
  { id: 'starter-kit', name: 'Starter KİT', price: 1200, icon: 'images/teklifsimge3.png', img: 'images/icerik2.png' },
  { id: 'p4-neth-kit', name: 'P4 Neth KİT', price: 2500, icon: 'images/teklifsimge4.png', img: 'images/icerik2.png' }
];

// Şimdilik tarayıcıda tutuluyor; Firebase bağlanınca Firestore'dan gelecek
const getPoints = () => Number(localStorage.getItem('flame_points') || 0);
const setPoints = v => localStorage.setItem('flame_points', v);
const getOwned = () => JSON.parse(localStorage.getItem('flame_owned') || '[]');
const setOwned = list => localStorage.setItem('flame_owned', JSON.stringify(list));

function renderPoints() {
  document.getElementById('pts').textContent = getPoints();
}

function renderProducts() {
  document.getElementById('products').innerHTML = PRODUCTS.map(p => `
    <div class="card product">
      <div class="preview"><img src="${p.img}" alt="${p.name} içerik"></div>
      <img class="icon" src="${p.icon}" alt="${p.name}">
      <h3>${p.name}</h3>
      <div class="price">${p.price} Puan</div>
      <button class="btn" onclick="buy('${p.id}')">Satın Al</button>
    </div>
  `).join('');
}

function renderOwned() {
  const list = getOwned();
  const wrap = document.getElementById('owned');
  if (!list.length) {
    wrap.innerHTML = '<p class="empty">Henüz bir satın alımın yok.</p>';
    return;
  }
  wrap.innerHTML = list.map(o => `
    <div class="owned">
      <div><strong>${o.name}</strong><br><small>${o.date}</small></div>
      <span class="badge ${o.status === 'done' ? 'done' : 'wait'}">
        ${o.status === 'done' ? 'Teslim edildi' : 'Bekliyor'}
      </span>
    </div>
  `).join('');
}

function buy(id) {
  const p = PRODUCTS.find(x => x.id === id);
  if (getPoints() < p.price) {
    alert('Yeterli puanın yok.');
    return;
  }
  // TODO: Firebase Cloud Function "buyProduct" ile sunucuda düş ve purchases'a yaz
  setPoints(getPoints() - p.price);
  const owned = getOwned();
  owned.unshift({ name: p.name, date: new Date().toLocaleDateString('tr-TR'), status: 'waiting' });
  setOwned(owned);
  renderPoints();
  renderOwned();
}

renderPoints();
renderProducts();
renderOwned();
</script>

</body>
</html>
