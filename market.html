<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Giriş - Flame SMP</title>
<link rel="icon" type="image/png" href="images/favicon.png">
<link rel="stylesheet" href="style.css">
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<style>
  .tabs{display:flex;gap:8px;margin:16px 0 20px}
  .tabs button{flex:1;padding:10px;border-radius:10px;border:2px solid var(--p);background:#fff;color:var(--p);font-weight:700;cursor:pointer}
  .tabs button.on{background:linear-gradient(135deg,var(--p),var(--s));color:#fff;border-color:transparent}
  .field{width:100%;padding:12px;margin-top:10px;border:2px solid var(--br);border-radius:10px;font-size:1rem;font-family:inherit}
  .field:focus{outline:none;border-color:var(--s)}
  .logout{margin-top:14px;background:#fff;color:var(--p);border:2px solid var(--p)}
</style>
</head>
<body>

<header>
  <div class="nav">
    <a class="logo" href="index.html"><img src="images/teklifsimge1.png" alt="">FLAME SMP</a>
    <div class="links">
      <a href="index.html">Ana Sayfa</a>
      <a href="minigame.html">Minigame</a>
      <a href="market.html">Market</a>
    </div>
    <span></span>
  </div>
</header>

<section class="container">
  <div class="card login-box">
    <h1 class="title" id="title">Giriş Yap</h1>
    <p class="sub">Oyuncu adın ve şifrenle devam et.</p>

    <div id="authBox">
      <div class="tabs">
        <button type="button" id="tabLogin" class="on">Giriş Yap</button>
        <button type="button" id="tabRegister">Kayıt Ol</button>
      </div>
      <input class="field" id="username" placeholder="Oyuncu adı (3-16 karakter, harf/rakam/_)" autocomplete="username">
      <input class="field" id="password" type="password" placeholder="Şifre (en az 6 karakter)" autocomplete="current-password">
      <button class="btn" id="submitBtn" style="width:100%;margin-top:14px">Giriş Yap</button>
    </div>

    <div id="loggedBox" style="display:none">
      <p id="welcome" style="font-weight:700;color:var(--p)"></p>
      <button class="btn logout" id="logoutBtn">Çıkış Yap</button>
    </div>

    <p class="msg" id="msg"></p>
  </div>
</section>

<script src="firebase-config.js"></script>
<script>
let mode = 'login';
const $ = id => document.getElementById(id);

const USER_RE = /^[a-zA-Z0-9_]{3,16}$/;
const emailFor = name => name.toLowerCase() + '@flamesmp.local';

function setMode(m) {
  mode = m;
  $('tabLogin').classList.toggle('on', m === 'login');
  $('tabRegister').classList.toggle('on', m === 'register');
  $('submitBtn').textContent = m === 'login' ? 'Giriş Yap' : 'Kayıt Ol';
  $('title').textContent = m === 'login' ? 'Giriş Yap' : 'Kayıt Ol';
  $('password').autocomplete = m === 'login' ? 'current-password' : 'new-password';
  $('msg').textContent = '';
}
$('tabLogin').onclick = () => setMode('login');
$('tabRegister').onclick = () => setMode('register');

function friendlyError(e) {
  switch (e.code) {
    case 'auth/email-already-in-use': return 'Bu oyuncu adı zaten alınmış.';
    case 'auth/invalid-credential':
    case 'auth/wrong-password':
    case 'auth/user-not-found': return 'Oyuncu adı veya şifre yanlış.';
    case 'auth/weak-password': return 'Şifre en az 6 karakter olmalı.';
    case 'auth/too-many-requests': return 'Çok fazla deneme yaptın, biraz bekleyip tekrar dene.';
    default: return 'Hata: ' + e.message;
  }
}

$('submitBtn').onclick = async () => {
  const name = $('username').value.trim();
  const pass = $('password').value;
  const msg = $('msg');

  if (!USER_RE.test(name)) { msg.textContent = 'Oyuncu adı 3-16 karakter olmalı; sadece harf, rakam ve _ kullanabilirsin.'; return; }
  if (pass.length < 6) { msg.textContent = 'Şifre en az 6 karakter olmalı.'; return; }

  $('submitBtn').disabled = true;
  try {
    if (mode === 'register') {
      const cred = await auth.createUserWithEmailAndPassword(emailFor(name), pass);
      await cred.user.updateProfile({ displayName: name });
      await db.collection('users').doc(cred.user.uid).set({
        username: name,
        points: 0,
        dailyDay: 0,
        dailyCount: 0
      });
    } else {
      await auth.signInWithEmailAndPassword(emailFor(name), pass);
    }
  } catch (e) {
    msg.textContent = friendlyError(e);
  } finally {
    $('submitBtn').disabled = false;
  }
};

$('logoutBtn').onclick = () => auth.signOut();

auth.onAuthStateChanged(user => {
  if (user) {
    $('authBox').style.display = 'none';
    $('loggedBox').style.display = 'block';
    $('title').textContent = 'Hoş geldin!';
    $('welcome').textContent = `Giriş yapıldı: ${user.displayName || ''}`;
  } else {
    $('authBox').style.display = 'block';
    $('loggedBox').style.display = 'none';
    setMode(mode);
  }
});
</script>

</body>
</html>
