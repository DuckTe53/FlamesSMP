<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Market - Flame SMP</title>
<link rel="icon" type="image/png" href="logoflame.png">
<link rel="stylesheet" href="style.css">
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
</head>
<body>

<header>
  <div class="nav">
    <a class="logo" href="index.html"><img src="logoflame.png" alt="">FLAME SMP</a>
    <div class="links">
      <a href="index.html">Ana Sayfa</a>
      <a href="minigame.html">Minigame</a>
      <a class="active" href="market.html">Market</a>
    </div>
    <span class="pts">Puan: <strong id="pts">0</strong></span>
  </div>
</header>

<section class="container">
  <h2>Alınanlar</h2>
  <div class="card" style="margin-bottom:40px">
    <div class="owned-list" id="owned">
      <p class="empty">Giriş yapınca alımların burada görünür.</p>
    </div>
  </div>

  <h2>Market</h2>
  <p class="sub" id="info">Teklifin üstüne gelince içeriğini veya üretim dizilimini görebilirsin.</p>
  <div class="grid" id="products"></div>
</section>

<script src="firebase-config.js"></script>
<script>
const PRODUCTS = [
  { id: 'extra-kalp',   name: 'Extra Kalp',  price: 150,  icon: 'teklifsimge1.png', img: 'icerik1.png' },
  { id: 'revive',       name: 'Revive',      price: 500,  icon: 'teklifsimge2.png', img: null },
  { id: 'revive-book',  name: 'Revive Book', price: 1200, icon: 'teklifsimge5.png', img: 'icerik2.png' },
  { id: 'starter-kit',  name: 'Starter KİT', price: 1500, icon: 'teklifsimge3.png', img: 'icerik3.PNG' },
  { id: 'p4-neth-kit',  name: 'P4 Neth KİT', price: 2800, icon: 'teklifsimge4.png', img: 'icerik4.PNG' }
];
const ICON = Object.fromEntries(PRODUCTS.map(p => [p.id, p.icon]));

let myPoints = 0;
let unsubUser = null, unsubOwned = null;

const info = document.getElementById('info');
function renderProducts() {
  document.getElementById('products').innerHTML = PRODUCTS.map(p => `
    <div class="card product">
      ${p.img ? `<div class="preview"><img src="${p.img}" alt="${p.name} içerik"></div>` : ''}
      <img class="icon" src="${p.icon}" alt="${p.name}">
      <h3>${p.name}</h3>
      <div class="price">${p.price} Puan</div>
      <button class="btn" onclick="buy('${p.id}')">Satın Al</button>
    </div>
  `).join('');
}

function renderOwned(docs) {
  const wrap = document.getElementById('owned');
  if (!docs.length) {
    wrap.innerHTML = '<p class="empty">Henüz bir satın alım yok.</p>';
    return;
  }
  wrap.innerHTML = `<div class="owned-grid">` + docs.map(o => {
    const done = o.status === 'done';
    return `
      <div class="owned-tile ${done ? 'done' : 'wait'}">
        <img src="${ICON[o.productId] || ''}" alt="${o.name}">
        <strong>${o.name}</strong>
        <small>${o.username || ''}</small>
        <span class="badge ${done ? 'done' : 'wait'}">${done ? 'Teslim edildi' : 'Bekliyor'}</span>
      </div>`;
  }).join('') + `</div>`;
}

auth.onAuthStateChanged(user => {
  if (unsubUser) unsubUser();
  if (unsubOwned) unsubOwned();

  if (!user) {
    myPoints = 0;
    document.getElementById('pts').textContent = 0;
  } else {
    unsubUser = db.collection('users').doc(user.uid).onSnapshot(snap => {
      myPoints = (snap.data() || {}).points || 0;
      document.getElementById('pts').textContent = myPoints;
    });
  }

  if (user) {
    unsubOwned = db.collection('purchases').orderBy('createdAt', 'desc')
      .onSnapshot(snap => renderOwned(snap.docs.map(d => d.data())), err => {
        document.getElementById('owned').innerHTML = `<p class="empty">Liste yüklenemedi: ${err.message}</p>`;
      });
  } else {
    renderOwned([]);
  }
});

async function buy(id) {
  const user = auth.currentUser;
  if (!user) { alert('Satın almak için giriş yapmalısın.'); return; }

  const p = PRODUCTS.find(x => x.id === id);
  if (myPoints < p.price) { alert('Yeterli puanın yok.'); return; }

  try {
    const batch = db.batch();
    batch.update(db.collection('users').doc(user.uid), {
      points: firebase.firestore.FieldValue.increment(-p.price)
    });
    batch.set(db.collection('purchases').doc(), {
      uid: user.uid,
      username: user.displayName || '',
      productId: p.id,
      name: p.name,
      price: p.price,
      status: 'waiting',
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    await batch.commit();
    alert(`${p.name} satın alındı! Teslim için bekle.`);
  } catch (e) {
    alert('Satın alma başarısız: ' + e.message);
  }
}

renderProducts();
</script>
</body>
</html>
